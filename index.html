block;width:8px;height:8px;border-radius:50%;background:#d8dfda;margin-left:7px}.lessonlink.done .dot{background:var(--good)}main{min-width:0}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,34px);margin-bottom:20px}.eyebrow{color:var(--brand);font-weight:800;font-size:.85rem;letter-spacing:.02em}.panel h2{font-size:clamp(1.55rem,2.6vw,2.2rem);line-height:1.3;margin:.15em 0 .45em}.panel h3{font-size:1.07rem;margin:0 0 7px}.lead{color:var(--muted);margin:0 0 16px}.source{color:var(--muted);font-size:.85rem;margin-top:-4px}.block{border-top:1px solid var(--line);padding:20px 0}.block:first-of-type{border-top:0}.block p{margin:6px 0}.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Arial,sans-serif}.example{background:#eff6f3;border-right:4px solid var(--brand);padding:16px;border-radius:8px}.step{padding:10px 0;border-bottom:1px solid #cadbd3}.step:last-child{border:0}.choicegrid{display:grid;gap:8px;margin:12px 0}.choice{width:100%;text-align:right;padding:11px 14px;border:1px solid #baccc4;background:#fff;border-radius:9px;color:var(--ink);min-height:45px}.choice:hover:not(:disabled){border-color:var(--brand);background:#f0f8f4}.choice:disabled{cursor:default}.choice.good{border:2px solid var(--good);background:#eaf7ee}.choice.bad{border:2px solid var(--bad);background:#fff0ef}.feedback{margin-top:12px;border-radius:9px;padding:12px 14px;background:#f0f7f3;border-right:4px solid var(--good)}.feedback.bad{background:#fff2ef;border-color:var(--bad)}.feedback small{display:block;color:var(--muted)}.btn{border:1px solid var(--brand);background:var(--brand);color:white;border-radius:9px;padding:10px 15px;min-height:43px}.btn.secondary{background:white;color:var(--brand)}.btn.ghost{border-color:#bdcac3;color:var(--ink);background:white}.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.mini{font-size:.88rem;color:var(--m </style></head><body><header class="top"><div><h1>BUS2108 · رفيق التعلّم <small>افهم بالعربية، وأجب بالإنجليزية</small></h1></div><div class="mode" aria-label="وضع الاستخدام"><button id="selfMode" class="active" type="button">مذاكرة ذاتية</button><button id="teacherMode" type="button">شرح مع المعلّم</button></div></header><div class="shell"><aside class="side" id="sidebar"><div class="row" style="justify-content:space-between"><h2>مسار الدراسة</h2><button id="toggleIndex" class="btn ghost mobileIndex" type="button" aria-expanded="false">الفهرس</button></div><div class="progressbar" aria-label="التقدم"><span id="progressFill"></span></div><div id="progressText" class="ptext"></div><nav class="nav" aria-label="أقسام الموقع"><button data-view="home">البداية</button><button data-view="vocab">المفردات والتدريبات</button><button data-view="mistakes">مراجعة الأخطاء</button><button data-view="quiz">اختبار تجريبي</button><button data-view="about">المصادر والتغطية</button></nav><div id="lessonNav"></div></aside><main id="main" tabindex="-1"></main></div><script>
const lessons = [
{id:'ob1',ch:1,title:'ما السلوك التنظيمي؟',src:'الفصل 1: الشرائح 2–6',goal:'تمييز موضوع السلوك التنظيمي وما يفعله المدير.',terms:['organizational behavior','interpersonal skills'],explain:'يدرس السلوك التنظيمي (Organizational Behavior, OB) أثر الفرد والجماعة وبنية المؤسسة في سلوك الناس داخل العمل، بهدف تحسين فاعلية المؤسسة. من أنشطة المدير الإدارة التقليدية كالتخطيط، والتواصل، وإدارة العاملين، وبناء العلاقات داخل المؤسسة وخارجها. وتؤثر مهارات التعامل مع الناس في رضا الموظفين والاحتفاظ بهم.',worked:['موظف كفء يترك فريقه بسبب علاقة متوترة مع مديره.','نسأل عن سلوك الفرد وعلاقته بالمدير وأثرهما في المؤسسة؛ هذه مسألة في OB.'],tryQ:'فريق يتراجع أداؤه بسبب ضعف التواصل. أي مجال يساعد في فهم الموقف؟',tryA:['السلوك التنظيمي','المحاسبة فقط','تصميم المبنى'],tryC:0,tryWhy:'التواصل وسلوك الفريق من موضوعات OB.',check:'يدرس OB الأفراد والجماعات وبنية المؤسسة.',checkC:true,summary:'OB يربط سلوك الناس بفاعلية المؤسسة.',enQ:'Which issue is most directly studied in organizational behavior?',enA:['How team communication affects performance','The color of office walls only','The price of raw materials only','The weather forecast'],enC:0,enWhy:'OB studies people and groups at work.',trap:'most directly'},
{id:'ob2',ch:1,title:'الدليل بدل الحدس وحده',src:'الفصل 1: الشرائح 7–10، 26',goal:'تمييز الدراسة المنهجية والإدارة المبنية على الدليل عن الحدس.',terms:['intuition','systematic study','evidence-based management','data analytics'],explain:'الحدس (Intuition) إحساس سريع. الدراسة المنهجية (Systematic Study) تفحص العلاقات والبيانات لتفسير الأسباب والتنبؤ بالسلوك. الإدارة المبنية على الدليل (Evidence-Based Management) تستخدم أفضل دليل علمي متاح للقرار. تحليل البيانات والذكاء الاصطناعي يساعدان في اكتشاف أنماط، مع بقاء الحكم البشري مهمًا.',worked:['مدير يظن أن التأخر سببه الكسل.','يجمع بيانات المواعيد والعبء والتنقل ثم يفحص العلاقة قبل أن يقرر؛ هذا أقرب إلى الدليل.'],tryQ:'أي تصرف يمثل إدارة مبنية على الدليل؟',tryA:['قرار مبني على دراسة وبيانات مناسبة','قرار مبني على أول انطباع','تقليد قرار شركة أخرى دون فحص'],tryC:0,tryWhy:'المعيار هو أفضل دليل متاح في الموقف.',check:'تعني الدراسة المنهجية أن سلوك الإنسان عشوائي تمامًا.',checkC:false,summary:'افحص البيانات والسياق قبل تعميم السبب.',enQ:'A manager bases a staffing decision on reliable research and relevant data. This is an example of:',enA:['evidence-based management','intuition alone','random selection','stereotyping'],enC:0,enWhy:'The decision uses scientific evidence and relevant data.',trap:'example of'},
{id:'ob3',ch:1,title:'مصادر المعرفة وحدود التعميم',src:'الفصل 1: الشرائح 11–12، 26',goal:'تحديد التخصصات المساندة وفهم متغيرات الموقف.',terms:['psychology','social psychology','sociology','anthropology','contingency variables'],explain:'تساهم Psychology وSocial Psychology وSociology وAnthropology في فهم السلوك. لا توجد قاعدة واحدة تفسر كل الناس؛ قد تغيّر ظروف الموقف (Contingency Variables) أثر القرار.',worked:['أسلوب رقابة يحسّن أداء فريق متمرس لكنه يزعج فريقًا يحتاج استقلالية.','نفس الأسلوب أعطى نتيجتين؛ خبرة الفريق وطبيعة عمله متغيرات موقف.'],tryQ:'لماذا قد لا تنجح نصيحة إدارية واحدة في كل الفرق؟',tryA:['لأن ظروف الموقف تختلف','لأن كل الأبحاث بلا فائدة','لأن الفرق متطابقة'],tryC:0,tryWhy:'تتغير النتائج باختلاف الناس والسياق.',check:'Contingency variables تعني ظروفًا تؤثر في العلاقة بين السبب والنتيجة.',checkC:true,summary:'افهم من يعمل، وأين، وتحت أي ظروف.',enQ:'Why are there few absolutes in organizational behavior?',enA:['Human behavior depends on context','All people respond identically','Evidence is never useful','Managers cannot learn'],enC:0,enWhy:'Situational conditions affect behavior.',trap:'few absolutes'},
{id:'ob4',ch:1,title:'تحديات المدير وفرصه',src:'الفصل 1: الشرائح 13–19، 27',goal:'ربط التنوع والعولمة والتقنية والأخلاق وCSR بعمل المدير.',terms:['workforce inclusion','globalization','ethical behavior','corporate social responsibility'],explain:'يتعامل المدير مع تنوع القوى العاملة وشمول الجميع، والعمل عبر ثقافات مختلفة، وتأثير التقنية ووسائل التواصل. السلوك الأخلاقي يوافق المعايير المقبولة. المسؤولية الاجتماعية (CSR) فعل اختياري ينفع المجتمع أو البيئة فوق ما يفرضه القانون. بيئة العمل الإيجابية تنمّي نقاط القوة والتعاون. وتطرح الشريحة 27 للنقاش مخاوف استخدام الذكاء الاصطناعي في المؤسسة وأثر استخدام وسائل التواصل في المزاج، دون إجابة نموذجية محددة.',worked:['شركة تقلل نفاياتها طوعًا وتفتح فرص مشاركة متكافئة للفريق.','خفض النفايات مثال CSR؛ إتاحة المشاركة مثال للشمول.'],tryQ:'مبادرة اختيارية لحماية البيئة تتجاوز المتطلبات القانونية تسمى:',tryA:['CSR','التأخر الوظيفي','الحدس'],tryC:0,tryWhy:'CSR تتجاوز الالتزام القانوني الأساسي.',check:'الشمول يعني خلق مكان يشعر فيه الأعضاء بالدعم والمشاركة.',checkC:true,summary:'التحديات الإدارية تشمل البشر والسياق العالمي والتقني والأخلاقي.',enQ:'Which action best illustrates corporate social responsibility?',enA:['Voluntarily supporting a community program beyond legal requirements','Following only a required safety law','Ignoring employee concerns','Measuring attendance'],enC:0,enWhy:'CSR involves voluntary action beyond legal requirements.',trap:'beyond legal requirements'},
{id:'ob5',ch:1,title:'نموذج OB ومستويات التحليل',src:'الفصل 1: الشرائح 20–24، الرسم في 21',goal:'تصنيف المدخلات والعمليات والنتائج، وعلى أي مستوى تظهر.',terms:['inputs','processes','outcomes','individual level','group level','organizational level'],explain:'النموذج يربط المدخلات (Inputs) مثل قيم الأفراد وبنية الجماعة وثقافة المؤسسة، بالعمليات (Processes) مثل العواطف والتواصل، ثم النتائج (Outcomes) مثل أداء الموظف والفريق وإنتاجية المؤسسة. مستويات التحليل: فرد، جماعة، مؤسسة.',worked:['ثقافة الشركة تشجع الحوار؛ الفرق تتواصل؛ يتحسن أداؤها.','الثقافة مدخل تنظيمي، التواصل عملية جماعية، وأداء الفريق نتيجة جماعية.'],tryQ:'في النموذج، هل أداء الفريق مدخل أم عملية أم نتيجة؟',tryA:['نتيجة','عملية','مدخل'],tryC:0,tryWhy:'أداء الفريق يقيس حصيلة عمل الجماعة.',check:'الإنتاجية والبقاء التنظيمي نتيجتان على مستوى المؤسسة.',checkC:true,summary:'اسأل دائمًا: ما المستوى؟ وما موقع الفكرة في التسلسل؟',enQ:'In the OB model, team performance is an outcome at which level?',enA:['Group','Individual','Organizational','National'],enC:0,enWhy:'Team performance is a group-level outcome.',trap:'at which level'},
{id:'ob6',ch:1,title:'مخرجات OB ومهاراته',src:'الفصل 1: الشرائح 22–25',goal:'تمييز الفاعلية والكفاءة والمواطنة والانسحاب ومهارات الدراسة.',terms:['effectiveness','efficiency','productivity','citizenship behavior','withdrawal behavior'],explain:'الفاعلية (Effectiveness) تحقيق احتياجات العملاء، والكفاءة (Efficiency) تحقيق الهدف بتكلفة أقل؛ تجمعهما الإنتاجية. سلوك المواطنة مساعدة اختيارية خارج الواجب الرسمي. سلوك الانسحاب يباعد الموظف عن المؤسسة. يطوّر OB التفكير النقدي والتواصل والتعاون وتحليل المعرفة والمسؤولية الاجتماعية.',worked:['فريق يخدم كل العملاء لكن يهدر موارد كثيرة.','هو فعّال في تلبية الحاجة، لكنه أقل كفاءة بسبب الكلفة.'],tryQ:'مساعدة زميل طوعًا خارج المطلوب رسميًا مثال على:',tryA:['سلوك المواطنة','سلوك الانسحاب','الكفاءة'],tryC:0,tryWhy:'هذه مساهمة اختيارية تفيد بيئة العمل.',check:'الكفاءة تعني تحقيق الهدف بأقل تكلفة ممكنة.',checkC:true,summary:'فرّق بين تحقيق الهدف وتكلفته، وبين سلوك إضافي وسلوك انسحاب.',enQ:'A firm meets customer needs but uses excessive resources. It is effective but lacks:',enA:['efficiency','customers','goals','teamwork'],enC:0,enWhy:'Efficiency concerns using resources at low cost.',trap:'but lacks'},
{id:'div1',ch:2,title:'التنوع الظاهر والعميق',src:'المحاضرة 02: ص 2–4',goal:'تصنيف أوجه التنوع الظاهرة والعميقة والخصائص الشخصية.',terms:['surface-level diversity','deep-level diversity','biographical characteristics','glass ceiling','glass cliff'],explain:'التنوع الظاهر (Surface-level) يسهل ملاحظته، مثل العمر والعرق. التنوع العميق (Deep-level) يظهر بعد التعارف، مثل القيم والشخصية وتفضيلات العمل. يوضح رسم ص 4 أن فجوة الأجور بين الجنسين ضاقت عبر الزمن لكنها لم تختفِ. الخصائص الشخصية تشمل العمر والهوية الجندرية والعرق. السقف الزجاجي حاجز خفي أمام الترقية؛ الهاوية الزجاجية تعيين قيادي في ظرف شديد الخطورة.',worked:['شخصان في العمر نفسه لكن يختلفان في قيمة الاستقلال في العمل.','العمر فرق ظاهر، وقيمة الاستقلال فرق عميق.'],tryQ:'اختلاف تفضيلات العمل بين زميلين من أي نوع؟',tryA:['تنوع عميق','تنوع ظاهر','سقف زجاجي'],tryC:0,tryWhy:'تفضيلات العمل لا تظهر عادة من النظرة الأولى.',check:'Glass cliff يعني منح دور قيادي محفوف بالمخاطر.',checkC:true,summary:'الظاهر يُرى سريعًا، والعميق يحتاج معرفة؛ السقف يعيق والهاوية تعرّض للخطر.',enQ:'Which characteristic best represents deep-level diversity?',enA:['Work values','Age','Visible appearance','Race'],enC:0,enWhy:'Values are harder to observe at first glance.',trap:'best represents'},
{id:'div2',ch:2,title:'التحيز والتمييز',src:'المحاضرة 02: ص 5–6',goal:'تمييز الموقف المتحيز عن الفعل التمييزي وأثر الممارسة.',terms:['prejudice','implicit bias','discrimination','disparate impact','disparate treatment'],explain:'التحيز (Prejudice) موقف أو حكم عام تجاه جماعة؛ التحيز الضمني قد يكون خارج الوعي. التمييز (Discrimination) فعل يكرّس تفاوت الفرص. المعاملة المتفاوتة (Disparate Treatment) فعل مقصود؛ الأثر المتفاوت (Disparate Impact) نتيجة تمييزية قد تنشأ من قاعدة تبدو محايدة.',worked:['قاعدة واحدة لكل المتقدمين تستبعد فئة محمية بمعدل كبير من غير قصد.','افحص النتيجة: قد يكون الأثر المتفاوت، لا المعاملة المقصودة.'],tryQ:'مدير يرفض مرشحًا عمدًا بسبب انتمائه إلى فئة معينة. ما المصطلح الأقرب؟',tryA:['Disparate treatment','Disparate impact','Deep-level diversity'],tryC:0,tryWhy:'النية المباشرة هنا هي العلامة الفاصلة.',check:'التحيز موقف؛ التمييز فعل أو ممارسة.',checkC:true,summary:'اسأل: هل هو اعتقاد، أم سلوك، وهل التمييز مقصود؟',enQ:'A seemingly neutral hiring rule disadvantages a protected group. This is most likely:',enA:['disparate impact','disparate treatment','job involvement','employee engagement'],enC:0,enWhy:'The discriminatory effect can occur without stated intent.',trap:'seemingly neutral'},
{id:'div3',ch:2,title:'صور التمييز في العمل',src:'المحاضرة 02: ص 7–8، الجدولان',goal:'التعرف على صور التمييز من أمثلة قصيرة.',terms:['sexual harassment','intimidation','mockery','exclusion','incivility'],explain:'تضم الأمثلة: سياسة تحرم من فرصة متكافئة، تحرشًا جنسيًا، تهديدًا أو ترهيبًا، سخرية وإهانات، استبعادًا من فرص أو نقاشات، وافتقارًا للاحترام مثل المقاطعة وتجاهل الرأي. قد يحدث الاستبعاد دون قصد.',worked:['تُستبعد موظفة باستمرار من النقاشات المهمة والترشيحات.','المؤشر هو الحرمان من المشاركة والفرص؛ هذا Exclusion.'],tryQ:'مقاطعة رأي موظف باستمرار وعدم الاعتراف بمساهمته مثال على:',tryA:['Incivility','Glass cliff','Job satisfaction'],tryC:0,tryWhy:'هذا سلوك غير محترم في التعامل اليومي.',check:'يمكن أن يحدث Exclusion دون قصد.',checkC:true,summary:'تعرّف نوع السلوك من الفعل المحدد في السيناريو.',enQ:'Repeatedly ignoring an employee’s comments is an example of:',enA:['incivility','job involvement','equity','affect intensity'],enC:0,enWhy:'Incivility includes disrespect and ignoring opinions.',trap:'repeatedly'},
{id:'div4',ch:2,title:'التصنيف والتنميط والوصم',src:'المحاضرة 02: ص 9–10',goal:'تمييز ثلاث أفكار متشابهة وآثارها.',terms:['social categorization','ingroup','outgroup','stereotyping','stereotype threat','stigma'],explain:'التصنيف الاجتماعي يجمع الناس في فئات؛ قد نرى جماعة الداخل (Ingroup) وجماعة الخارج (Outgroup). التنميط (Stereotyping) الحكم على فرد من صورة جماعته. تهديد الصورة النمطية خوف الفرد من أن يُحكم عليه وفقها. الوصم (Stigma) صفة قد تُخفى وتحمل حكمًا اجتماعيًا سلبيًا في سياق معين.',worked:['طالبة تخشى أن يُفسّر خطؤها بأنه دليل على صورة نمطية عن مجموعتها.','الخوف من الحكم وفق الصورة هو Stereotype Threat.'],tryQ:'الحكم على زميل بصفة لمجرد انتمائه إلى جماعة يسمى:',tryA:['Stereotyping','Stigma','Organizational commitment'],tryC:0,tryWhy:'الانتقال من صورة الجماعة إلى حكم على الفرد هو التنميط.',check:'Ingroup تعني الجماعة التي يرى الشخص نفسه منتميًا إليها.',checkC:true,summary:'التصنيف يقسم، والتنميط يحكم، والتهديد خوف من ذلك الحكم.',enQ:'An employee fears being judged through a negative group stereotype. This describes:',enA:['stereotype threat','surface diversity','efficiency','voice'],enC:0,enWhy:'The concern about being judged is the key clue.',trap:'fears being judged'},
{id:'div5',ch:2,title:'ديناميكيات الفرق المتنوعة',src:'المحاضرة 02: ص 11–12',goal:'فهم أثر نوع الاختلاف وخطوط الانقسام في الفريق.',terms:['functional diversity','fault lines','group conflict'],explain:'قد يزيد التنوع الظاهر الخلاف في بدايات الفريق، وقد تولد القيم المختلفة خلافًا أيضًا. التنوع الوظيفي في الخبرات والمهارات قد يحسّن الأداء والابتكار. خطوط الانقسام (Fault Lines) حدود متصوّرة تقسم الفريق إلى مجموعات فرعية، خاصة إذا تراكبت اختلافات متعددة.',worked:['ينقسم فريق إلى مجموعتين وفق اللغة والخبرة؛ يتنافسان بدل إتمام المهمة.','تراكب الفروق صنع Fault Line أضرّ بالتعاون.'],tryQ:'تنوع التخصصات الذي يضيف طرق حل جديدة يسمى:',tryA:['Functional diversity','Fault line','Implicit bias'],tryC:0,tryWhy:'المقصود اختلاف الخبرات الوظيفية المفيد للابتكار.',check:'قد تضر خطوط الانقسام أداء الفريق عندما تتنافس المجموعات الفرعية.',checkC:true,summary:'التنوع قد يفيد أو يخلق خلافًا بحسب نوعه وطريقة إدارة الفريق.',enQ:'A team splits into competing subgroups along language and experience differences. These divisions are:',enA:['fault lines','job facets','moods','ethics'],enC:0,enWhy:'Fault lines split a team into subgroups.',trap:'competing subgroups'},
{id:'div6',ch:2,title:'الثقافة عبر الدول',src:'المحاضرة 02: ص 13–17، جدولا 15–16',goal:'التعرف على أبعاد Hofstede وGLOBE والذكاء الثقافي.',terms:['power distance','uncertainty avoidance','individualism','collectivism','future orientation','cultural intelligence'],explain:'يقارن Hofstede الثقافات عبر أبعاد منها بُعد السلطة، الفردية والجماعية، تجنب عدم اليقين، التوجّه الزمني، الأدوار الجندرية، والانغماس/الكبح. يحدد GLOBE تسعة أبعاد: بُعد السلطة، وتجنب عدم اليقين، والتوجه للمستقبل، وجماعية المؤسسة، وجماعية الداخل، والمساواة الجندرية، والحزم، والتوجه الإنساني، والتوجه للأداء. يوضح الجدولان أوجه الشبه بين الإطارين. الذكاء الثقافي (CQ) قدرة العمل بفاعلية بين ثقافات مختلفة.',worked:['فريق يتقبل تفاوتًا كبيرًا في صلاحيات المدير والموظفين.','هذا مثال على Power Distance مرتفع.'],tryQ:'القدرة على العمل بفاعلية مع زملاء من ثقافات مختلفة هي:',tryA:['Cultural intelligence','Job satisfaction','Incivility'],tryC:0,tryWhy:'CQ يتعلق بالتكيف والعمل عبر الاختلاف الثقافي.',check:'Power distance يتعلق بتقبّل تفاوت السلطة.',checkC:true,summary:'اقرأ اسم البعد ومعناه؛ لا تفترض أن بلدًا معينًا له درجة محددة دون بيانات.',enQ:'The extent to which unequal power is accepted is called:',enA:['power distance','future orientation','assertiveness','indulgence'],enC:0,enWhy:'Power distance concerns acceptance of unequal power.',trap:'extent to which'},
{id:'div7',ch:2,title:'إدارة التنوع والإنصاف والشمول',src:'المحاضرة 02: ص 17–19',goal:'تمييز Diversity وEquity وInclusion وممارساتها.',terms:['diversity','equity','inclusion','common ingroup identity'],explain:'التنوع وجود اختلافات بين الناس. الإنصاف (Equity) إزالة العوائق وإتاحة فرص عادلة مع مراعاة اختلاف نقطة البداية. الشمول (Inclusion) شعور الجميع بالترحيب والتقدير والمشاركة. الهوية الجماعية المشتركة تنقل التركيز من «نحن/هم» إلى «نحن» أوسع. من الممارسات دعم الانتماء والمشاركة ومراجعة السياسات.',worked:['مدير يتيح أداة وصول لموظف يحتاجها ثم يشركه في القرار.','الأداة تدعم الإنصاف؛ إشراكه والشعور بقيمته يدعم الشمول.'],tryQ:'إشراك كل أعضاء الفريق في النقاش وإشعارهم بقيمة مساهماتهم مثال على:',tryA:['Inclusion','Implicit bias','Glass ceiling'],tryC:0,tryWhy:'الشمول يتعلق بالترحيب والمشاركة الفعلية.',check:'Equity تراعي الحواجز المختلفة عند إتاحة الفرص.',checkC:true,summary:'التنوع اختلاف، والإنصاف فرصة عادلة، والشمول مشاركة وانتماء.',enQ:'A manager removes barriers so all employees can access opportunities. This most directly promotes:',enA:['equity','stereotyping','surface acting','withdrawal'],enC:0,enWhy:'Equity addresses barriers to opportunity.',trap:'most directly'},
{id:'att1',ch:3,title:'الاتجاه ومكوّناته',src:'المحاضرة 03: ص 2–4، الرسم في 3',goal:'تمييز الفكرة والشعور والسلوك داخل الاتجاه.',terms:['attitude','cognitive component','affective component','behavioral component'],explain:'الاتجاه (Attitude) تقييم مؤيد أو معارض لشيء أو شخص أو حدث. المكوّن المعرفي (Cognitive) ما أعتقده وأقيّمه؛ الوجداني (Affective) ما أشعر به؛ السلوكي (Behavioral) ما أفعله أو أنوي فعله.',worked:['«القرار غير عادل» فكرة؛ «أنا غاضب» شعور؛ «سأتحدث إلى المدير» نية فعل.','نصنّفها: Cognitive ثم Affective ثم Behavioral.'],tryQ:'«أشعر بالارتياح في عملي» أي مكوّن؟',tryA:['Affective','Cognitive','Behavioral'],tryC:0,tryWhy:'العبارة تصف شعورًا.',check:'Cognitive component يعني التقييم أو الاعتقاد.',checkC:true,summary:'فكر، شعور، فعل: ثلاثة مفاتيح لتصنيف الاتجاه.',enQ:'“I feel proud of my job” reflects the _____ component of an attitude.',enA:['affective','cognitive','behavioral','structural'],enC:0,enWhy:'Feeling proud is an emotion.',trap:'feel'},
{id:'att2',ch:3,title:'الاتجاه والسلوك والتنافر',src:'المحاضرة 03: ص 5–6',goal:'شرح التنافر المعرفي وما يقوّي العلاقة بين الاتجاه والسلوك.',terms:['cognitive dissonance','attitude–behavior relationship','social pressure'],explain:'غالبًا تتنبأ الاتجاهات بالسلوك، لكن العلاقة تتأثر بأهمية الاتجاه، وارتباطه بالفعل المحدد، وسهولة استحضاره، وضغط الآخرين، والخبرة المباشرة. التنافر المعرفي (Cognitive Dissonance) عدم اتساق محسوس بين اتجاهات الشخص أو بين اتجاهه وسلوكه؛ ويحاول تقليله.',worked:['موظف يؤمن بأهمية الصدق لكنه يخفي خطأً.','الاعتقاد والسلوك لا يتطابقان؛ قد يشعر بتنافر ويسعى لتقليله.'],tryQ:'أي عامل قد يقوّي قدرة الاتجاه على توقع السلوك؟',tryA:['خبرة مباشرة بالموضوع','غياب الصلة بين الاتجاه والفعل','افتراض تطابق الناس'],tryC:0,tryWhy:'تذكر المحاضرة الخبرة المباشرة ضمن العوامل المهمة.',check:'يمكن أن يحدث التنافر بين اتجاه الشخص وسلوكه.',checkC:true,summary:'التناقض يخلق تنافرًا؛ وسياق الاتجاه يحدد قوة تنبئه.',enQ:'An employee values honesty but lies to a customer. The inconsistency may create:',enA:['cognitive dissonance','job involvement','positive affect','functional diversity'],enC:0,enWhy:'Belief and behavior conflict.',trap:'inconsistency'},
{id:'att3',ch:3,title:'الاتجاهات الوظيفية الرئيسة',src:'المحاضرة 03: ص 7–12',goal:'تمييز الرضا والاندماج والالتزام والدعم والتماهي والتمكين.',terms:['job satisfaction','job involvement','organizational commitment','organizational identification','perceived organizational support','employee engagement','psychological empowerment'],explain:'الرضا الوظيفي شعور إيجابي بعد تقييم العمل. المشاركة النفسية في الوظيفة هي Job Involvement؛ الالتزام التنظيمي رغبة في البقاء مع المؤسسة وأهدافها؛ التماهي التنظيمي ربط هوية الشخص بهوية المؤسسة. الدعم التنظيمي المدرك (POS) اعتقاد أن المؤسسة تقدّر مساهمته وتهتم به. التمكين النفسي إحساس بالتأثير والكفاءة والمعنى والاستقلال. الاندماج الوظيفي حماس ومشاركة ورضا تجاه العمل. هذه الاتجاهات متداخلة لكن لكل منها تركيز.',worked:['موظفة تقول: «أؤمن بأهداف المؤسسة وأريد البقاء فيها».','العلامة هي الرغبة في العضوية والأهداف؛ Organizational Commitment.'],tryQ:'«شركتي تقدر مساهمتي وتهتم بسلامتي» يعبّر عن:',tryA:['POS','Job involvement','CWB'],tryC:0,tryWhy:'الدعم التنظيمي المدرك يخص تقييم الموظف لاهتمام المؤسسة به.',check:'Employee engagement يشمل الحماس للعمل.',checkC:true,summary:'اسأل: الرضا عن الوظيفة، الارتباط بالوظيفة، أم الارتباط بالمؤسسة؟',enQ:'Believing the organization values one’s contribution and well-being describes:',enA:['perceived organizational support','job involvement','exit','affect intensity'],enC:0,enWhy:'POS focuses on the organization’s care and value.',trap:'values one’s contribution'},
{id:'att4',ch:3,title:'قياس الرضا وأسبابه',src:'المحاضرة 03: ص 13–18، الرسوم في 14 و16 و18',goal:'تمييز طريقتي القياس وأبرز العوامل المؤثرة.',terms:['single global rating','job facets','job conditions','core self-evaluations'],explain:'يقاس الرضا بسؤال عام واحد (Single Global Rating) أو بجمع تقييم جوانب الوظيفة (Job Facets) مثل طبيعة العمل والإشراف والأجر والترقية والزملاء. ترفع ظروف العمل المناسبة والتدريب والاستقلال والدعم الاجتماعي الرضا. تؤثر شخصية الفرد وتقييمه لذاته. وتذكر شريحة 14 أن الجاذبية تختلف باختلاف الجهد البدني والبيئة والدخل والضغط وفرص التوظيف. يُظهر رسم الدول في شريحة 16 تفاوت الرضا، وكانت هولندا وسويسرا في أعلاه ضمن العينة المعروضة. يظهر رسم شريحة 18 أن العلاقة بين متوسط الأجر والرضا ليست قوية.',worked:['استبانة تسأل عن الأجر والمشرف والزملاء كلًا على حدة.','هذا قياس جوانب الوظيفة؛ ليس تقييمًا عامًا بسؤال واحد.'],tryQ:'سؤال واحد: «ما مدى رضاك إجمالًا عن عملك؟» يمثل:',tryA:['Single global rating','Summation of job facets','Exit'],tryC:0,tryWhy:'سؤال عام واحد عن مجمل الرضا.',check:'ارتفاع الأجر وحده يضمن أعلى رضا وظيفي بحسب الرسم.',checkC:false,summary:'القياس العام يختصر؛ الجوانب تفصل. الأجر عامل واحد وليس التفسير الكامل.',enQ:'A survey rates supervision, pay, coworkers, and promotion separately. It uses:',enA:['summation of job facets','a single global rating','cognitive dissonance','surface acting'],enC:0,enWhy:'It measures several job elements separately.',trap:'separately'},
{id:'att5',ch:3,title:'نتائج الرضا الوظيفي',src:'المحاضرة 03: ص 19–20',goal:'ربط الرضا بالأداء والمواطنة والعملاء والحياة دون مبالغة سببية.',terms:['job performance','organizational citizenship behavior','customer satisfaction','life satisfaction'],explain:'يرتبط الرضا بسلوك المواطنة التنظيمية الاختياري ورضا العملاء والرضا عن الحياة. العلاقة مع الأداء موجودة، وتذكر المحاضرة أن الإنتاجية قد تقود إلى الرضا أيضًا؛ لا تختزلها في اتجاه واحد.',worked:['موظف راضٍ يساعد زملاءه طوعًا خارج متطلبات دوره.','المساعدة مثال OCB، والرضا يرتبط بزيادة احتمالها.'],tryQ:'أي سلوك يعد OCB؟',tryA:['مساعدة زميل طوعًا خارج الواجب','تنفيذ المهمة المطلوبة فقط','التأخر المستمر'],tryC:0,tryWhy:'السلوك إضافي واختياري ويفيد المؤسسة.',check:'الرضا عن العمل والرضا عن الحياة بينهما ارتباط إيجابي في المحاضرة.',checkC:true,summary:'انتبه إلى كلمة يرتبط؛ الارتباط لا يثبت سببًا وحيدًا.',enQ:'Which behavior is an example of organizational citizenship behavior?',enA:['Voluntarily helping a coworker beyond formal duties','Repeated lateness','Stealing supplies','Resigning'],enC:0,enWhy:'OCB is voluntary extra-role help.',trap:'beyond formal duties'},
{id:'att6',ch:3,title:'استجابات عدم الرضا',src:'المحاضرة 03: ص 21–23، جدول 21',goal:'تصنيف Exit وVoice وLoyalty وNeglect وفهم CWB.',terms:['exit','voice','loyalty','neglect','counterproductive work behavior'],explain:'تختلف الاستجابات ببعدين: نشط/سلبي وبنّاء/هدّام. Voice نشط وبنّاء: اقتراح تحسين. Exit نشط وهدّام: ترك العمل. Loyalty سلبي وبنّاء: انتظار التحسن بتفاؤل. Neglect سلبي وهدّام: السماح بتدهور الحال بالتأخر وضعف الجهد. قد يظهر السلوك المضاد للإنتاجية (CWB) كتأخر أو اعتداء أو سرقة.',worked:['موظف غير راضٍ يقترح حلًا ويناقشه مع مديره.','الاستجابة نشطة وتحاول الإصلاح، إذن Voice.'],tryQ:'موظف يكثر تأخره ويخفض جهده دون محاولة للإصلاح:',tryA:['Neglect','Voice','Loyalty'],tryC:0,tryWhy:'الإهمال سلبي ويسمح بتدهور العمل.',check:'Voice استجابة نشطة وبنّاءة.',checkC:true,summary:'ابحث عن الفعل: يترك، يقترح، ينتظر، أو يهمل.',enQ:'An unhappy employee suggests changes to improve work conditions. This response is:',enA:['voice','exit','loyalty','neglect'],enC:0,enWhy:'Voice actively and constructively seeks improvement.',trap:'suggests changes'},
{id:'emo1',ch:4,title:'الوجدان والعاطفة والمزاج',src:'المحاضرة 04: ص 2–7، الرسم في 3',goal:'تمييز Affect وEmotions وMoods وذكر الانفعالات الستة.',terms:['affect','emotions','moods','moral emotions','positive affect','negative affect'],explain:'Affect مظلة للمشاعر. Emotion شعور قوي مرتبط بشخص أو حدث، غالبًا قصير وله تعبير واضح. Mood أقل شدة وأطول وقد لا يكون له سبب محدد. العواطف الأخلاقية تنشأ من حكمنا على موقف له معنى أخلاقي وقد تختلف ثقافيًا. تذكر المحاضرة الغضب والخوف والحزن والسعادة والاشمئزاز والمفاجأة كعواطف أساسية. وتشير إلى السعي لوجدان إيجابي مرتفع ووجدان سلبي منخفض.',worked:['غضبت لدقائق بعد تعليق محدد؛ بقيت متكدّرًا بقية اليوم بلا سبب واضح.','الأول Emotion بسبب محدد وقصر المدة؛ الثاني Mood أطول وأعم.'],tryQ:'شعور طويل نسبيًا وسببه غير واضح غالبًا هو:',tryA:['Mood','Emotion','Disparate impact'],tryC:0,tryWhy:'المزاج أطول وأقل ارتباطًا بمثير محدد.',check:'Affect يشمل العواطف والمزاج.',checkC:true,summary:'حدث محدد وشدة أعلى: Emotion؛ مدة أطول وسبب أعم: Mood.',enQ:'A feeling that lasts for hours and has no clear trigger is most likely a:',enA:['mood','brief emotion','display rule','stereotype'],enC:0,enWhy:'Moods last longer and may lack a specific cause.',trap:'no clear trigger'},
{id:'emo2',ch:4,title:'مصادر العاطفة والمزاج',src:'المحاضرة 04: ص 8–10',goal:'تحديد مصادر تغير المشاعر دون تعميم قاطع.',terms:['affect intensity','stress','social interactions','sleep','exercise'],explain:'تختلف شدة تجربة العاطفة باختلاف الشخصية (Affect Intensity). قد يؤثر وقت اليوم والأسبوع، والضغط المستمر، والتفاعل الاجتماعي، وجودة النوم، والرياضة في المزاج. وقد تمتد آثار تفاعل سلبي في العمل إلى الحياة الأسرية. تذكر المحاضرة أيضًا استمرار صور نمطية جندرية عن التعبير العاطفي.',worked:['موظف ينام نومًا سيئًا عدة ليالٍ ويلاحظ مزاجًا أسوأ.','ضعف النوم مصدر ممكن لزيادة الوجدان السلبي؛ لا نجزم بأنه السبب الوحيد.'],tryQ:'أي عامل تذكره المحاضرة بوصفه مصدرًا للمزاج؟',tryA:['جودة النوم','لون الشعار فقط','رقم الطابق فقط'],tryC:0,tryWhy:'ضعف جودة النوم قد يزيد الوجدان السلبي.',check:'يمكن لضغط منخفض لكنه مستمر أن يسيء المزاج.',checkC:true,summary:'المزاج يتأثر بعوامل فردية وزمنية واجتماعية وصحية.',enQ:'Which factor may increase negative affect according to the lecture?',enA:['Poor sleep quality','A clear office logo','A higher floor number','A longer job title'],enC:0,enWhy:'Poor sleep is linked with more negative affect.',trap:'negative affect'},
{id:'emo3',ch:4,title:'العمل العاطفي والتمثيل',src:'المحاضرة 04: ص 11–12',goal:'تمييز المشاعر الفعلية والمعروضة والتمثيل السطحي والعميق.',terms:['emotional labor','felt emotions','displayed emotions','surface acting','deep acting','emotional dissonance'],explain:'العمل العاطفي (Emotional Labor) إظهار مشاعر تتطلبها المؤسسة أثناء التعامل. Felt Emotions ما نشعر به حقًا، وDisplayed Emotions ما نظهره وفق متطلبات العمل. Surface Acting إخفاء الشعور وتغيير التعبير الخارجي؛ Deep Acting محاولة تغيير الشعور الداخلي نفسه. التنافر العاطفي اختلاف ما نشعر به عما نظهره، وقد يرتبط على المدى الطويل بالإرهاق وانخفاض الأداء والرضا.',worked:['موظف خدمة غاضب لكنه يبتسم فقط لأنه مطلوب منه ذلك.','غيّر التعبير الخارجي دون شعوره: Surface Acting.'],tryQ:'موظفة تحاول أن تشعر بتعاطف حقيقي قبل التعامل مع عميل صعب:',tryA:['Deep acting','Surface acting','Exit'],tryC:0,tryWhy:'هي تحاول تعديل الشعور الداخلي.',check:'Emotional dissonance اختلاف بين الشعور الحقيقي وما يُظهره الشخص.',checkC:true,summary:'السطحي يغيّر الوجه؛ العميق يحاول تغيير الشعور.',enQ:'An employee hides frustration and displays a smile without changing inner feelings. This is:',enA:['surface acting','deep acting','cognitive reappraisal','job involvement'],enC:0,enWhy:'Only the outward display changes.',trap:'without changing inner feelings'},
{id:'emo4',ch:4,title:'الأحداث العاطفية والذكاء العاطفي',src:'المحاضرة 04: ص 13–14',goal:'شرح AET ومكوّنات الذكاء العاطفي.',terms:['affective events theory','emotional intelligence','perceive','regulate'],explain:'نظرية الأحداث العاطفية (AET) تقول إن أحداث العمل تثير ردودًا عاطفية تؤثر في الرضا والأداء؛ حتى الأحداث الصغيرة قد تتراكم. الذكاء العاطفي قدرة على إدراك المشاعر في الذات والآخرين، وفهم معناها، وتنظيمها.',worked:['يتلقى موظف تعليقات مزعجة صغيرة كل يوم فيتغير شعوره بالعمل.','AET تفسر كيف تتراكم أحداث العمل العاطفية وتؤثر في النتائج.'],tryQ:'القدرة على ملاحظة مشاعر الذات والآخرين وفهمها وتنظيمها هي:',tryA:['Emotional intelligence','Emotional dissonance','Job facets'],tryC:0,tryWhy:'هذه القدرات الثلاث تصف الذكاء العاطفي.',check:'AET تربط أحداث العمل بالمشاعر ثم بالأداء والرضا.',checkC:true,summary:'الأحداث تولد مشاعر؛ والذكاء العاطفي يساعد على إدراكها وفهمها وتنظيمها.',enQ:'Affective events theory suggests that workplace events influence performance partly through:',enA:['emotional reactions','office size alone','job titles alone','national borders alone'],enC:0,enWhy:'AET links events, emotions, and outcomes.',trap:'partly through'},
{id:'emo5',ch:4,title:'تنظيم العواطف',src:'المحاضرة 04: ص 15–16',goal:'تمييز تقنيات تنظيم الشعور والتعبير.',terms:['emotion regulation','emotional suppression','cognitive reappraisal','social sharing'],explain:'تنظيم العاطفة (Emotion Regulation) التعرف على الشعور وتعديله. من التقنيات: التمثيل السطحي والعميق، كبت التعبير (Emotional Suppression)، إعادة تفسير الموقف (Cognitive Reappraisal)، ومشاركة المشاعر اجتماعيًا (Social Sharing). تختلف آثار هذه التقنيات بحسب الموقف.',worked:['فسّر موظف تعليقًا مقتضبًا من مديره بأنه بسبب ضيق الوقت بدل افتراض العداء.','غيّر تفسيره للموقف، وهذه Cognitive Reappraisal.'],tryQ:'الحديث مع شخص موثوق عن تجربة مزعجة يسمى:',tryA:['Social sharing','Emotional suppression','Exit'],tryC:0,tryWhy:'المشاركة الاجتماعية تعني التحدث عن المشاعر مع الآخرين.',check:'Cognitive reappraisal تعني إعادة تفسير الموقف.',checkC:true,summary:'ميّز بين كبت التعبير، وتعديل التفسير، ومشاركة الشعور.',enQ:'An employee reinterprets a stressful comment in a less threatening way. This is:',enA:['cognitive reappraisal','emotional suppression','surface diversity','neglect'],enC:0,enWhy:'The employee changes the interpretation of the event.',trap:'reinterprets'}
];

function renderHome(){return `<section class="panel"><div class="eyebrow">ابدأ من الفهم ثم لغة السؤال</div><h2>درس قصير، محاولة، ثم سؤال إنجليزي</h2><p class="lead">المادة مستخلصة من الملفات الأربعة المرفقة. اقرأ الشرح العربي، جرّب بنفسك، ثم أجب عن التدريب الإنجليزي. الترجمة تظهر عند الطلب في الدروس، وتختفي في الاختبار.</p><div class="row"><button class="btn" data-open="${lessons.find(l=>!state.done[l.id])?.id||lessons[0].id}">تابع الدراسة</button><button class="btn secondary" data-view="vocab">تدرّب على المفردات</button></div></section><section class="panel"><h2>الفصول الأربعة</h2><div class="reportlist">${[1,2,3,4].map(ch=>`<div class="stat"><strong>${chapterNames[ch]}</strong><p class="mini">${lessons.filter(l=>l.ch===ch).length} دروس قصيرة</p><button class="btn secondary" data-open="${lessons.find(l=>l.ch===ch).id}">افتح الفصل</button></div>`).join('')}</div></section><section class="panel"><h2>كيف تتعلّم هنا؟</h2><p>استخدم «شرح مع المعلّم» لكشف المثال خطوة خطوة. في المذاكرة الذاتية، جرّب الأسئلة ثم اقرأ سبب الإجابة. تُحفظ الأخطاء والتقدم في هذا المتصفح.</p><p class="footerNote">الاختبار التجريبي تدريب مقترح؛ لم تتضمن الملفات نموذج اختبار رسميًا أو تحديدًا لنطاق الاختبار.</p></section>`}
function renderLesson(){const l=lesson(current);const shown=state.mode==='self'?l.worked.length:teacherStep;return `<article class="panel"><div class="eyebrow">الفصل ${l.ch} · ${chapterNames[l.ch]}</div><h2>${esc(l.title)}</h2><div class="source">المرجع: ${esc(l.src)}</div><div class="block"><h3>هدف الدرس</h3><p>${esc(l.goal)}</p><div class="terms">${l.terms.map(t=>`<button class="term" data-term="${esc(t)}" title="افتح معنى الكلمة">${E(t)}</button>`).join('')}</div></div><div class="block"><h3>الفكرة ببساطة</h3><p>${esc(l.explain)}</p></div><div class="block"><h3>مثال محلول</h3><div class="example">${l.worked.slice(0,shown).map((s,i)=>`<div class="step"><strong>الخطوة ${i+1}:</strong> ${esc(s)}</div>`).join('')||'<p>اكشف الخطوة الأولى عندما تكون جاهزًا.</p>'}</div>${state.mode==='teacher'&&shown<l.worked.length?`<button class="btn secondary" id="revealStep" type="button" style="margin-top:10px">اكشف الخطوة التالية</button>`:''}</div><div class="block"><h3>الآن جرّب مثالًا قريبًا</h3><p>${esc(l.tryQ)}</p><div class="choicegrid" id="tryChoices">${l.tryA.map((a,i)=>`<button class="choice" data-kind="try" data-choice="${i}">${esc(a)}</button>`).join('')}</div><div id="tryFeedback" aria-live="polite"></div></div><div class="block"><h3>تحقق سريع قبل الانتقال</h3><p>${esc(l.check)}</p><div class="row" id="checkChoices"><button class="btn secondary" data-kind="check" data-choice="true">صحيح</button><button class="btn secondary" data-kind="check" data-choice="false">خطأ</button></div><div id="checkFeedback" aria-live="polite"></div></div><div class="block"><h3>الخلاصة</h3><div class="soft">${esc(l.summary)}</div></div><div class="block"><h3>تدريب بالإنجليزية</h3><p lang="en" dir="ltr">${esc(l.enQ)}</p><div class="row"><button class="btn ghost" id="hintBtn" type="button">أظهر كلمة مفتاحية</button><span class="mini">التلميح اختياري؛ درّب نفسك على الاستغناء عنه.</span></div><div id="hintBox"></div><div class="choicegrid" id="enChoices">${l.enA.map((a,i)=>`<button class="choice" lang="en" dir="ltr" style="text-align:left" data-kind="en" data-choice="${i}">${esc(a)}</button>`).join('')}</div><div id="enFeedback" aria-live="polite"></div></div><div class="row"><button class="btn" id="completeLesson">${state.done[l.id]?'أعد مراجعة الدرس':'علّم الدرس مكتملًا'}</button><button class="btn secondary" data-open="${lessons[(lessons.indexOf(l)+1)%lessons.length].id}">الدرس التالي</button></div></article>`}
function recordMistake(l,kind){const k=l.id+':'+kind;state.mistakes[k]=(state.mistakes[k]||0)+1;save()}
function answerLesson(kind,chosen){const l=lesson(current);let right,options,why,target,question;if(kind==='try'){right=l.tryC;options=l.tryA;why=l.tryWhy;target='tryFeedback';question=l.tryQ}else if(kind==='en'){right=l.enC;options=l.enA;why=l.enWhy;target='enFeedback';question=l.enQ}else{right=l.checkC;options=['false','true'];why=l.summary;target='checkFeedback';question=l.check;chosen=chosen==='true';right=l.checkC}
 if(kind!=='check')chosen=Number(chosen);const ok=chosen===right;const group=document.querySelectorAll(`[data-kind="${kind}"]`);group.forEach(b=>{b.disabled=true;const val=kind==='check'?b.dataset.choice==='true':Number(b.dataset.choice);b.classList.toggle('good',val===right);b.classList.toggle('bad',val===chosen&&!ok)});if(!ok)recordMistake(l,kind);else{delete state.mistakes[l.id+':'+kind];save()}
 const correct=kind==='check'?(right?'صحيح':'خطأ'):options[right];const wrong=kind==='check'?(chosen?'صحيح':'خطأ'):options[chosen];document.getElementById(target).innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'إجابة صحيحة':'لنصل إلى السبب'}</strong><p>الإجابة: <b>${esc(correct)}</b>. ${esc(why)}</p>${ok?'':`<p>اختيارك «${esc(wrong)}» لا يطابق الدليل في السؤال. ${V(wrong)?'هذا المصطلح يعني '+esc(V(wrong)[1])+'.':''} ${kind==='en'?'انتبه إلى عبارة '+E(l.trap)+'.':''}</p><div class="row"><button class="btn secondary" data-diagnose="concept">المفهوم غير واضح</button><button class="btn secondary" data-diagnose="language">صياغة السؤال أربكتني</button></div><div id="remedy"></div>`}</div>`;document.querySelectorAll('[data-diagnose]').forEach(b=>b.onclick=()=>{document.getElementById('remedy').innerHTML=b.dataset.diagnose==='concept'?`<div class="soft">مراجعة علاجية: ${esc(l.explain)}<br><b>جرّب من جديد:</b> ${esc(l.tryQ)}</div>`:`<div class="soft">مراجعة لغوية: ${kind==='en'?'ركّز على '+E(l.trap)+'.':''} اقرأ السؤال مرة ثانية وحدد المطلوب قبل النظر إلى الخيارات. ${kind==='en'&&V(l.trap)?esc(V(l.trap)[1]):'ميّز كلمات السؤال الأساسية.'}</div>`});}
function renderVocab(){const filtered=vocab.map((v,i)=>({v,i})).filter(x=>x.v[0].toLowerCase().includes(vocabFilter.toLowerCase())||x.v[1].includes(vocabFilter));return `<section class="panel"><div class="eyebrow">استرجاع نشط</div><h2>المفردات ولغة الأسئلة</h2><p class="lead">انقر البطاقة بعد أن تحاول تذكر معناها. كلمات مثل ${E('except')} و${E('most likely')} أُضيفت كتدريب على صياغة محتملة، وليست دليلًا على أنها سترد في الاختبار.</p><input class="filter" id="vocabSearch" type="search" placeholder="ابحث بالإنجليزية أو العربية" value="${esc(vocabFilter)}" aria-label="ابحث عن كلمة"><div class="row"><button class="btn secondary" id="startMatch">مطابقة</button><button class="btn secondary" id="startFill">إكمال فراغ</button><button class="btn secondary" id="startRecall">استرجاع من الذاكرة</button></div><div id="vocabExercise"></div><div class="vocabgrid">${filtered.map(({v,i})=>`<div class="vcard" data-card="${i}"><div class="front"><strong>${E(v[0])}</strong><p class="mini">توقع المعنى أولًا.</p></div><div class="back"><strong>${E(v[0])} — ${esc(v[1])}</strong><p>${esc(v[2])}</p><p>${E(v[3])}<br>${esc(v[4])}</p><div class="row"><button class="btn ghost" data-speak="${i}" type="button">🔊 نطق</button><button class="btn ghost" data-word-wrong="${i}" type="button">أضف للمراجعة</button></div></div><button class="btn secondary" data-flip="${i}" type="button">اقلب البطاقة</button></div>`).join('')}</div></section>`}
function renderExercise(type){const box=document.getElementById('vocabExercise');if(type==='match'){flashStart=(flashStart+4)%(vocab.length-4);matchSet=vocab.slice(flashStart,flashStart+4);const opts=[...matchSet].sort((a,b)=>a[1].localeCompare(b[1],'ar'));box.innerHTML=`<div class="exercise"><h3>طابق أربع كلمات مع معانيها</h3>${matchSet.map((v,i)=>`<label>${E(v[0])} <select id="match${i}"><option value="">اختر المعنى</option>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></label>`).join('')}<button class="btn" id="checkMatch">تحقق</button><div id="exerciseFeedback"></div></div>`;document.getElementById('checkMatch').onclick=()=>{let n=0;matchSet.forEach((v,i)=>{if(document.getElementById('match'+i).value===v[0])n++;else state.wordMistakes[v[0]]=true});save();document.getElementById('exerciseFeedback').innerHTML=`<div class="feedback ${n===4?'':'bad'}">${n} من 4 صحيحة. ${n<4?'اقلب بطاقات الكلمات التي أخطأت فيها ثم أعد المحاولة.':''}</div>`}}else if(type==='fill'){do{fillIndex=(fillIndex+1)%vocab.length}while(!vocab[fillIndex][3].toLowerCase().includes(vocab[fillIndex][0].toLowerCase()));const v=vocab[fillIndex];box.innerHTML=`<div class="exercise"><h3>أكمل بالإنجليزية</h3><p>${esc(v[1])}: ${E(v[3].replace(new RegExp(v[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____'))}</p><input id="fillInput" dir="ltr" aria-label="اكتب الكلمة الإنجليزية"><button class="btn" id="checkFill">تحقق</button><div id="exerciseFeedback"></div></div>`;document.getElementById('checkFill').onclick=()=>checkWord(v,'fillInput')}else{recallIndex=(recallIndex+7)%vocab.length;const v=vocab[recallIndex];box.innerHTML=`<div class="exercise"><h3>استرجع الكلمة من معناها</h3><p>${esc(v[1])} — ${esc(v[2])}</p><input id="recallInput" dir="ltr" aria-label="اكتب المصطلح الإنجليزي"><button class="btn" id="checkRecall">تحقق</button><div id="exerciseFeedback"></div></div>`;document.getElementById('checkRecall').onclick=()=>checkWord(v,'recallInput')}}
function checkWord(v,inputId){const answer=document.getElementById(inputId).value.trim().toLowerCase().replace(/\s+/g,' ');const ok=answer===v[0].toLowerCase();if(!ok)state.wordMistakes[v[0]]=true;else delete state.wordMistakes[v[0]];save();document.getElementById('exerciseFeedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح.':'الإجابة: '+E(v[0])+'.'} ${esc(v[2])}</div>`}
function renderMistakes(){const qs=Object.entries(state.mistakes),ws=Object.keys(state.wordMistakes);return `<section class="panel"><div class="eyebrow">ما يحتاج مراجعة</div><h2>أخطائي</h2><p class="lead">تُزال علامة السؤال عندما تجيب عنه إجابة صحيحة في الدرس. وتُزال علامة الكلمة بعد نجاحك في الاسترجاع أو الإكمال.</p><h3>الأسئلة (${qs.length})</h3>${qs.length?qs.map(([key,n])=>{const [id,kind]=key.split(':');const l=lesson(id);return `<div class="exercise"><b>${esc(l?.title||id)}</b> · ${kind==='en'?'سؤال إنجليزي':kind==='try'?'مثال قريب':'تحقق سريع'} · ${n} محاولة خاطئة <button class="btn secondary" data-open="${id}">أعد التدريب</button></div>`}).join(''):'<p>لا توجد أسئلة مسجلة بعد.</p>'}<h3>الكلمات (${ws.length})</h3>${ws.length?ws.map(w=>`<span class="term">${E(w)} · ${esc(V(w)?.[1]||'')}</span>`).join(''):'<p>لا توجد كلمات مسجلة بعد.</p>'}<div class="row" style="margin-top:25px"><button class="btn secondary" data-view="vocab">تدرّب على المفردات</button></div></section>`}
function startQuiz(){quizOrder=lessons.map(l=>({id:l.id,permutation:[0,1,2,3].sort(()=>Math.random()-.5)}));quizAnswers={};quizFinished=false;setView('quiz')}
function renderQuiz(){if(!quizOrder.length)return `<section class="panel"><div class="eyebrow">تدريب مقترح</div><h2>اختبار تجريبي بالإنجليزية</h2><p>سؤال واحد لكل درس (${lessons.length} سؤالًا). لا تظهر ترجمة أو تلميحات أثناء الإجابة. لم ترد في الملفات نماذج اختبار أو تحديد رسمي لنطاقه.</p><button class="btn" id="startQuiz">ابدأ الاختبار</button></section>`;if(quizFinished)return renderReport();return `<section class="panel"><div class="eyebrow">Practice exam · proposed</div><h2>BUS2108 Practice Test</h2><p lang="en" dir="ltr">Choose the best answer. Answer all questions before submitting.</p><div dir="ltr" lang="en">${quizOrder.map((item,n)=>{const l=lesson(item.id);return `<div class="quizQ"><b>${n+1}. ${esc(l.enQ)}</b>${item.permutation.map((original,j)=>`<label><input type="radio" name="q${n}" value="${original}" ${quizAnswers[n]===original?'checked':''}> ${esc(l.enA[original])}</label>`).join('')}</div>`}).join('')}</div><button class="btn" id="finishQuiz">تسليم الاختبار</button><div id="quizNotice" role="alert"></div></section>`}
function renderReport(){const total=quizOrder.length,correct=quizOrder.filter((item,n)=>quizAnswers[n]===lesson(item.id).enC).length;const chapters=[1,2,3,4].map(ch=>{const items=quizOrder.map((x,n)=>({l:lesson(x.id),n})).filter(x=>x.l.ch===ch);return {ch,ok:items.filter(x=>quizAnswers[x.n]===x.l.enC).length,total:items.length}});const wrong=quizOrder.map((x,n)=>({l:lesson(x.id),n})).filter(x=>quizAnswers[x.n]!==x.l.enC);return `<section class="panel"><div class="eyebrow">تقرير بعد الاختبار</div><h2>${correct} من ${total} إجابة صحيحة</h2><div class="reportlist">${chapters.map(c=>`<div class="stat"><b>${chapterNames[c.ch]}</b><br><strong>${c.ok}/${c.total}</strong><p class="mini">${c.ok===c.total?'نقطة قوة':'تحتاج مراجعة'}</p></div>`).join('')}</div><h3 style="margin-top:24px">راجع هذه الموضوعات والكلمات</h3>${wrong.length?wrong.map(x=>`<div class="exercise"><b>${esc(x.l.title)}</b> · ${E(x.l.trap)}<p lang="en" dir="ltr">${esc(x.l.enQ)}</p><p>الإجابة: ${E(x.l.enA[x.l.enC])}. ${esc(x.l.enWhy)}</p><button class="btn secondary" data-open="${x.l.id}">راجع الدرس</button></div>`).join(''):'<p>أجبت عن جميع الأسئلة إجابة صحيحة.</p>'}<button class="btn" id="retryQuiz">اختبار جديد</button></section>`}
function renderAbout(){return `<section class="panel"><div class="eyebrow">المرجع وحدود التغطية</div><h2>ما بُني عليه هذا الملف</h2><p>المحتوى التعليمي من الملفات الأربعة المرفقة، مع إعادة صياغة الأمثلة والأسئلة لأغراض التدريس. رابط المصدر الدقيق داخل كل درس.</p><ul><li>عرض Robbins، الفصل 1: الشرائح 2–27. الشريحة 1 غلاف و28 إشعار حقوق.</li><li>المحاضرة 02: الصفحات 2–19. صفحة 1 غلاف و20 صفحة ختامية بلا محتوى دراسي.</li><li>المحاضرة 03: الصفحات 2–23، بما فيها الرسوم والجداول في 3 و14 و16 و18 و21. صفحة 1 غلاف و24 صفحة ختامية.</li><li>المحاضرة 04: الصفحات 2–16، بما فيها الرسم في 3 و7. صفحة 1 غلاف و17 صفحة ختامية.</li></ul><p>لا يوجد في الملفات نموذج أسئلة أو تحديد مؤكد لما يدخل الاختبار. أسئلة التدريب والاختبار المقترح مكتوبة خصيصًا لهذا الملف. كلمات <span class="en" dir="ltr">except, most likely, NOT</span> تدريب إضافي على فهم صياغة السؤال، ولا تعني ورودها في الاختبار.</p><p>النطق يستخدم صوت المتصفح المتاح عبر <span class="en" dir="ltr">speechSynthesis</span>؛ توافر صوت إنجليزي وجودته يعتمدان على الجهاز والمتصفح، وقد يتطلب تنزيل الصوت مسبقًا في نظام التشغيل.</p><div class="row"><button class="btn danger" id="resetProgress">إعادة ضبط التقدم</button></div></section>`}
function bindView(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLesson(b.dataset.open));if(view==='lesson'){document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>answerLesson(b.dataset.kind,b.dataset.choice));document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>{vocabFilter=b.dataset.term;setView('vocab')});const r=document.getElementById('revealStep');if(r)r.onclick=()=>{teacherStep++;render()};document.getElementById('hintBtn').onclick=()=>{const l=lesson(current),v=V(l.trap),box=document.getElementById('hintBox'),advanced=Object.keys(state.done).length>=6;if(advanced&&!box.dataset.step){box.dataset.step='keyword';box.innerHTML=`<div class="hint">انتبه إلى ${E(l.trap)}. <button class="btn ghost" id="hintTranslate" type="button">أظهر معناها</button></div>`;document.getElementById('hintTranslate').onclick=()=>{box.innerHTML=`<div class="hint">${E(l.trap)}: ${esc(v?.[1]||'كلمة مفتاحية في صياغة السؤال')}.</div>`}}else box.innerHTML=`<div class="hint">${E(l.trap)}: ${esc(v?.[1]||'كلمة مفتاحية في صياغة السؤال')}. اقرأ المطلوب ثم الخيارات.</div>`;state.hintsUsed++;save()};document.getElementById('completeLesson').onclick=()=>{state.done[current]=true;save();render()}}if(view==='vocab'){const s=document.getElementById('vocabSearch');s.oninput=()=>{vocabFilter=s.value;const pos=s.selectionStart;render();const n=document.getElementById('vocabSearch');n.focus();n.setSelectionRange(pos,pos)};document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>document.querySelector(`[data-card="${b.dataset.flip}"]`).classList.toggle('flipped'));document.querySelectorAll('[data-word-wrong]').forEach(b=>b.onclick=()=>{state.wordMistakes[vocab[Number(b.dataset.wordWrong)][0]]=true;save();b.textContent='أُضيفت للمراجعة'});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis' in window)){alert('النطق غير متاح في هذا المتصفح.');return}const u=new SpeechSynthesisUtterance(vocab[Number(b.dataset.speak)][0]);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)});document.getElementById('startMatch').onclick=()=>renderExercise('match');document.getElementById('startFill').onclick=()=>renderExercise('fill');document.getElementById('startRecall').onclick=()=>renderExercise('recall')}if(view==='quiz'){const a=document.getElementById('startQuiz');if(a)a.onclick=startQuiz;const f=document.getElementById('finishQuiz');if(f){document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{quizAnswers[Number(r.name.slice(1))]=Number(r.value)});f.onclick=()=>{if(Object.keys(quizAnswers).length!==quizOrder.length){document.getElementById('quizNotice').textContent=`أجب عن جميع الأسئلة أولًا: ${Object.keys(quizAnswers).length}/${quizOrder.length}.`;return}quizOrder.forEach((x,n)=>{const l=lesson(x.id);if(quizAnswers[n]!==l.enC)recordMistake(l,'en');else delete state.mistakes[l.id+':en']});save();quizFinished=true;render();window.scrollTo(0,0)}}const retry=document.getElementById('retryQuiz');if(retry)retry.onclick=startQuiz}if(view==='about'){document.getElementById('resetProgress').onclick=()=>{if(confirm('هل تريد حذف التقدم والأخطاء المحفوظة في هذا المتصفح؟')){localStorage.removeItem(KEY);state={done:{},mistakes:{},wordMistakes:{},hintsUsed:0,mode:'self'};quizOrder=[];setView('home')}}}}

function teachingTable(title,heads,rows,note=''){return `<section class="concept-visual"><h3>${esc(title)}</h3><div class="tablewrap" role="region" aria-label="${esc(title)}" tabindex="0"><table><thead><tr>${heads.map(h=>`<th scope="col">${mixed(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${mixed(c)}</th>`:`<td>${mixed(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${note?`<p class="mini">${mixed(note)}</p>`:''}</section>`}
function renderConceptVisual(id){const v=comparisons[id];let out=v?teachingTable(v.title,v.heads,v.rows,v.note):'';if(id==='div6')out+=`<details class="more"><summary>GLOBE: الأبعاد التسعة والمقارنة مع Hofstede</summary>${teachingTable('الأبعاد التسعة',['البعد','المعنى في جدول الملف'],globeRows)}<p>يشترك الإطاران في بُعد السلطة وتجنب عدم اليقين. ويقابل التوجه طويل الأجل التوجه للمستقبل بصورة قريبة. يفصل GLOBE الجماعية إلى جماعية المؤسسة وجماعية الداخل. التقارب بين الإطارين لا يعني تطابق كل بُعد.</p></details>`;if(sourceDetails[id])out+=`<details class="more"><summary>تفاصيل إضافية واردة في المصدر</summary>${sourceDetails[id].map(p=>`<p>${mixed(p)}</p>`).join('')}</details>`;return out;}

function showWordInline(word){
 const v=V(word),box=document.getElementById('termHelp');if(!v)return;
 box.innerHTML=`<div class="hint"><strong>${E(v[0])} — ${esc(v[1])}</strong><p>${esc(v[2])}</p><p>${E(v[3])}<br>${esc(v[4])}</p><button class="btn ghost" id="inlineSpeak">نطق المصطلح</button> <button class="btn ghost" id="closeTerm">إغلاق</button><span id="speechStatus" class="mini" role="status"></span></div>`;
 document.getElementById('inlineSpeak').onclick=()=>speakWord(v[0],document.getElementById('speechStatus'));

function speakWord(word,status){
 if(!('speechSynthesis' in window)){status.textContent='النطق غير متاح في هذا المتصفح.';return}
 const voices=speechSynthesis.getVoices(),english=voices.find(v=>/^en[-_]/i.test(v.lang)&&v.localService)||voices.find(v=>/^en[-_]/i.test(v.lang));
 const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;if(english)u.voice=english;
 u.onstart=()=>{status.textContent='جارٍ النطق…'};u.onend=()=>{status.textContent='انتهى النطق.'};u.onerror=()=>{status.textContent='تعذر النطق؛ تحقق من توفر صوت إنجليزي على الجهاز.'};
 status.textContent=english?(english.localService?'صوت محلي متاح.':'قد يحتاج الصوت إلى اتصال.'):'تجربة الصوت الافتراضي؛ يعتمد توفره على المتصفح.';
 speechSynthesis.cancel();speechSynthesis.speak(u);
}
answerLesson=function(kind,raw,replay=false){
 const l=lesson(current),t=teaching[l.id],chosen=kind==='check'?(raw===true||raw==='true'):Number(raw);
 const right=kind==='check'?l.checkC:kind==='en'?l.enC:l.tryC;
 const opts=kind==='en'?l.enA:kind==='try'?l.tryA:['خطأ','صحيح'];
 const ok=chosen===right,key=`${l.id}:${kind}`,target=document.getElementById(`${kind}Feedback`);
 if(!replay){responses[key]=chosen;if(ok){delete state.mistakes[key];delete state.errorDetails[key];if(kind==='en')state.learned[l.id]=true}else{recordMistake(l,kind);state.errorDetails[key]={chosen,time:Date.now()}}save()}
 document.querySelectorAll(`[data-kind="${kind}"]`).forEach(b=>{const val=kind==='check'?b.dataset.choice==='true':Number(b.dataset.choice);b.disabled=true;b.classList.toggle('good',val===right);b.classList.toggle('bad',val===chosen&&!ok)});
 const answer=kind==='check'?(right?'صحيح':'خطأ'):opts[right];
 const why=kind==='en'?t.why:kind==='try'?l.tryWhy:l.summary;
 const wrongWhy=kind==='en'?t.wrong[chosen-1]:kind==='try'?t.tw[chosen-1]:`العبارة ${right?'توافق':'لا توافق'} المفهوم. ${l.explain}`;
 target.innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'إجابة صحيحة ✓':'لنصل إلى السبب'}</strong><p>الإجابة: <b>${mixed(answer)}</b>. ${mixed(why)}</p>${ok?'':`<p>${mixed(wrongWhy||why)}</p><p class="mini">ما الذي أربكك؟ اختيارك يساعد في توجيه المراجعة ولا يُعد تشخيصًا آليًا.</p><div class="row"><button class="btn secondary" data-diagnose="concept">المفهوم غير واضح</button><button class="btn secondary" data-diagnose="language">صياغة السؤال أربكتني</button></div><div id="remedy-${kind}"></div>`}<button class="btn ghost retry-question" data-retry="${kind}">أعد المحاولة</button></div>`;
 target.querySelectorAll('[data-diagnose]').forEach(b=>b.onclick=()=>{state.diagnoses[key]=b.dataset.diagnose;save();showRemedy(l,kind,b.dataset.diagnose)});
 target.querySelector('[data-retry]').onclick=()=>{delete responses[key];document.querySelectorAll(`[data-kind="${kind}"]`).forEach(b=>{b.disabled=false;b.classList.remove('good','bad')});target.innerHTML=''};

function showRemedy(l,kind,type){

 if(type==='concept'){
  box.innerHTML=`<div class="exercise"><h3>تمرين علاجي جديد</h3><p>${esc(l.summary)}</p><p>${mixed(t.rem[0])}</p>${shuffle(t.rem[1].map((a,i)=>({a,i}))).map(x=>`<button class="choice" data-remedial="${x.i}">${mixed(x.a)}</button>`).join('')}<div class="remedy-result" aria-live="polite"></div></div>`;
  box.querySelectorAll('[data-remedial]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.remedial)===0;box.querySelector('.remedy-result').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح.':'راجع الفرق ثم حاول ثانية.'} ${mixed(t.rem[2])}</div>`;if(ok)box.querySelectorAll('[data-remedial]').forEach(x=>x.disabled=true)});

  const phrase=kind==='en'?l.trap:'أي مكوّن / أي مفهوم؟',meaning=kind==='en'?t.trap:'حدّد المفهوم الذي تطابقه دلائل المثال';
  box.innerHTML=`<div class="exercise"><h3>تمرين على فهم الصياغة</h3><p>${kind==='en'?E(phrase):esc(phrase)}</p><p>أي قراءة للمطلوب صحيحة؟</p><button class="choice" data-language-answer="0">${esc(meaning)}</button><button class="choice" data-language-answer="1">اختر أي مصطلح تتذكره ولو لم يطابق المثال</button><div class="remedy-result" aria-live="polite"></div></div>`;
  box.querySelectorAll('[data-language-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.languageAnswer==='0';box.querySelector('.remedy-result').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح.':'هذه القراءة لا تتبع المطلوب.'} ${esc(meaning)}. اقرأ دلائل المثال ثم استبعد الخيارات التي لا تصفها.</div>`});
 }

function filteredWords(){return vocab.map((v,i)=>({v,i})).filter(({v})=>{
 const query=vocabFilter.trim().toLowerCase();const hit=!query||v[0].toLowerCase().includes(query)||v[1].includes(query);
 const chapter=vocabChapter==='all'||lessons.some(l=>String(l.ch)===vocabChapter&&l.terms.some(t=>t.toLowerCase()===v[0].toLowerCase()))||extraVocabulary.some(w=>w[0]===v[0]&&String(w[5])===vocabChapter);
 return hit&&chapter&&(!reviewOnly||state.wordMistakes[v[0]])
})}
renderVocab=function(){
 const all=filteredWords(),pages=Math.max(1,Math.ceil(all.length/8));vocabPage=Math.min(vocabPage,pages-1);const selected=all.slice(vocabPage*8,vocabPage*8+8);
 return `<section class="panel"><div class="eyebrow">استرجاع نشط · دفعات من 8 كلمات</div><h2>المفردات والتدريبات</h2><p class="lead">توقّع المعنى قبل قلب البطاقة. استخدم التمارين لكتابة المصطلح من الذاكرة.</p><label for="vocabSearch">بحث بالكلمة أو معناها</label><input class="filter" id="vocabSearch" type="search" placeholder="اكتب بالإنجليزية أو العربية" value="${esc(vocabFilter)}"><div class="row"><label>الفصل <select id="vocabChapter"><option value="all">كل المفردات</option>${[1,2,3,4].map(n=>`<option value="${n}" ${String(n)===vocabChapter?'selected':''}>${chapterNames[n]}</option>`).join('')}</select></label><label><input type="checkbox" id="onlyWrongWords" ${reviewOnly?'checked':''}> الكلمات المسجلة للمراجعة فقط</label></div><div class="row exercise-tabs"><button class="btn secondary" id="startMatch">مطابقة</button><button class="btn secondary" id="startFill">إكمال فراغ</button><button class="btn secondary" id="startRecall">استرجاع من الذاكرة</button></div><div id="vocabExercise"></div><p class="mini">${all.length} كلمة توافق المرشحات · الدفعة ${vocabPage+1} من ${pages}</p><div class="vocabgrid">${selected.map(({v,i})=>`<div class="vcard" data-card="${i}"><div class="front"><strong>${E(v[0])}</strong><p class="mini">قل المعنى من ذاكرتك، ثم تحقق.</p></div><div class="back"><strong>${E(v[0])} — ${esc(v[1])}</strong><p>${esc(v[2])}</p><p>${E(v[3])}<br>${esc(v[4])}</p><div class="row"><button class="btn ghost" data-speak="${i}">نطق</button><button class="btn ghost" data-word-wrong="${i}">${state.wordMistakes[v[0]]?'مسجلة للمراجعة':'أضف للمراجعة'}</button></div><div class="speech-status mini" role="status"></div></div><button class="btn secondary" data-flip="${i}" aria-expanded="false">اقلب البطاقة</button></div>`).join('')||'<p>لا توجد كلمات مطابقة. غيّر البحث أو الفصل.</p>'}</div><div class="row pager"><button class="btn ghost" id="wordsPrev" ${vocabPage===0?'disabled':''}>الدفعة السابقة</button><button class="btn ghost" id="wordsNext" ${vocabPage>=pages-1?'disabled':''}>الدفعة التالية</button></div><p class="mini">مرجع الكلمة: الدرس الذي يستخدمها وصفحته الأصلية. كلمات التعليمات الإضافية مثل NOT وEXCEPT للتدريب المقترح على الصياغة.</p></section>`;
};
function normalWord(s){return String(s).normalize('NFKC').trim().toLowerCase().replace(/[–—‑]/g,'-').replace(/[-\s]+/g,' ').replace(/[.,;!?]+$/,'')}
function checkRecall(v,input,output){
 const value=input.value.trim();if(!value){output.innerHTML='<p class="mini">اكتب محاولة أولًا حتى نتحقق منها.</p>';return}
 const ok=normalWord(value)===normalWord(v[0]);if(ok)delete state.wordMistakes[v[0]];else state.wordMistakes[v[0]]=true;save();
 output.innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح ✓':'الإجابة: '+E(v[0])}<p>${esc(v[1])}. ${esc(v[2])}</p>${ok?'أُزيلت الكلمة من قائمة الأخطاء.':'انظر إلى الكلمة ثم غطّها وأعد كتابتها من الذاكرة.'}</div>`;
}
renderExercise=function(type){
 const box=document.getElementById('vocabExercise');let pool=filteredWords().map(x=>x.v);if(!pool.length){box.innerHTML='<p>لا توجد كلمات ضمن المرشحات الحالية.</p>';return}
 if(type==='match'){
  const unique=[...new Map([...shuffle(pool),...shuffle(vocab)].map(v=>[v[1],v])).values()];matchSet=unique.slice(0,4);const choices=shuffle(matchSet);
  box.innerHTML=`<div class="exercise"><h3>طابق المعنى في أربع كلمات</h3>${matchSet.map((v,i)=>`<label>${E(v[0])}<select id="match${i}" aria-label="معنى ${esc(v[0])}"><option value="">اختر</option>${choices.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select><span id="matchFeedback${i}" class="mini"></span></label>`).join('')}<button class="btn" id="checkMatch">تحقق</button><div id="exerciseFeedback" aria-live="polite"></div></div>`;
  document.getElementById('checkMatch').onclick=()=>{if(matchSet.some((v,i)=>!document.getElementById('match'+i).value)){document.getElementById('exerciseFeedback').textContent='اختر معنى لكل كلمة أولًا.';return}let n=0;matchSet.forEach((v,i)=>{const ok=document.getElementById('match'+i).value===v[0];if(ok){n++;delete state.wordMistakes[v[0]]}else state.wordMistakes[v[0]]=true;document.getElementById('matchFeedback'+i).textContent=` ${ok?'✓':'✕'} ${v[1]}: ${v[2]}`});save();document.getElementById('exerciseFeedback').innerHTML=`<div class="feedback ${n===4?'':'bad'}">${n} من 4 صحيحة. ${n===4?'أُزيلت الكلمات المتقنة من الأخطاء.':'سُجلت الكلمات المخطوءة للمراجعة.'}</div>`};
 }else{
  if(type==='fill'){const candidates=pool.filter(v=>v[3].toLowerCase().includes(v[0].toLowerCase()));if(candidates.length)pool=candidates}
  const pending=pool.filter(v=>state.wordMistakes[v[0]]),v=shuffle(pending.length?pending:pool)[0],isFill=type==='fill',inputId=isFill?'fillInput':'recallInput',buttonId=isFill?'checkFill':'checkRecall';
  const sentence=v[3].replace(new RegExp(v[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____');
  box.innerHTML=`<div class="exercise"><h3>${isFill?'أكمل الفراغ بالمصطلح الإنجليزي':'استرجع المصطلح من معناه'}</h3><p>${esc(v[1])} — ${esc(v[2])}</p>${isFill?`<p lang="en" dir="ltr">${esc(sentence.includes('_____')?sentence:'The term is _____.')}</p>`:''}<label for="${inputId}">اكتب بالإنجليزية</label><input id="${inputId}" dir="ltr" autocomplete="off" spellcheck="false"><button class="btn" id="${buttonId}">تحقق</button><div id="exerciseFeedback" aria-live="polite"></div></div>`;
  document.getElementById(buttonId).onclick=()=>checkRecall(v,document.getElementById(inputId),document.getElementById('exerciseFeedback'));
  document.getElementById(inputId).onkeydown=e=>{if(e.key==='Enter')document.getElementById(buttonId).click()};
 }
};
function reviewWord(word){
 const v=V(word),box=document.getElementById('wordReviewBox');if(!v)return;selectedReviewWord=word;
 box.innerHTML=`<div class="exercise"><h3>استرجاع كلمة أخطأت فيها</h3><p>${esc(v[1])} — ${esc(v[2])}</p><label for="wordReviewInput">اكتب المصطلح الإنجليزي</label><input id="wordReviewInput" data-answer="${esc(v[0])}" dir="ltr" autocomplete="off"><button class="btn" id="checkReviewWord">تحقق</button><div id="wordReviewFeedback" aria-live="polite"></div></div>`;
 document.getElementById('checkReviewWord').onclick=()=>{checkRecall(v,document.getElementById('wordReviewInput'),document.getElementById('wordReviewFeedback'));if(!state.wordMistakes[word]){const b=[...document.querySelectorAll('[data-review-word]')].find(x=>x.dataset.reviewWord===word);if(b){b.textContent='تم الاسترجاع ✓';b.disabled=true}}};box.scrollIntoView({block:'center',behavior:'smooth'});
}
function mistakeQuestion(key){const [id,kind]=key.split(':'),l=lesson(id);if(!l)return null;if(kind==='exam'){const q=examBank.find(q=>q.id===id);return {l,kind,q:q.question,answers:q.answers,correct:q.correct,why:q.why,en:true}}if(kind==='en')return {l,kind,q:l.enQ,answers:l.enA,correct:l.enC,why:l.enWhy,en:true};if(kind==='try')return {l,kind,q:l.tryQ,answers:l.tryA,correct:l.tryC,why:l.tryWhy,en:false};return {l,kind,q:l.check,answers:['خطأ','صحيح'],correct:Number(l.checkC),why:l.summary,en:false}}
renderMistakes=function(){
 const qs=Object.entries(state.mistakes).filter(([key])=>mistakeQuestion(key)),ws=Object.keys(state.wordMistakes).filter(V);
 return `<section class="panel"><div class="eyebrow">أعد الاسترجاع حتى يثبت الفهم</div><h2>مراجعة الأخطاء</h2><p class="lead">أعد السؤال نفسه أو افتح درسه. تُزال علامة الخطأ بعد إجابة صحيحة؛ التقرير السابق يحتفظ بنتيجته الأصلية.</p><h3>الأسئلة (${qs.length})</h3>${qs.map(([key,n],i)=>{const q=mistakeQuestion(key);return `<div class="exercise"><b>${esc(q.l.title)}</b><p class="mini">${q.kind==='exam'?'سؤال من الاختبار الجديد':q.en?'تدريب إنجليزي':'تحقق من الفهم'} · ${n} محاولة خاطئة${state.diagnoses[key]?' · اخترت مراجعة '+(state.diagnoses[key]==='concept'?'المفهوم':'لغة السؤال'):''}</p><div class="row"><button class="btn secondary" data-review-question="${esc(key)}" data-slot="${i}">أعد السؤال</button><button class="btn ghost" data-open="${q.l.id}">افتح الدرس</button></div><div id="questionReview${i}"></div></div>`}).join('')||'<p>لا توجد أسئلة مسجلة حاليًا.</p>'}<h3>الكلمات (${ws.length})</h3><p class="mini">هذه كلمات أضفتها أو أخطأت في تدريبها. لا نفترض أن خطأ السؤال يعني خطأ فهم كل كلمة فيه.</p><div class="row">${ws.map(w=>`<button class="btn secondary" data-review-word="${esc(w)}">راجع: ${E(w)}</button>`).join('')||'<p>لا توجد كلمات مسجلة حاليًا.</p>'}</div><div id="wordReviewBox"></div><button class="btn ghost" data-view="vocab" style="margin-top:20px">افتح المفردات</button></section>`;

function reviewQuestion(key,slot){const q=mistakeQuestion(key),box=document.getElementById('questionReview'+slot);box.innerHTML=`<p ${q.en?'dir="ltr" lang="en"':''}>${esc(q.q)}</p>${shuffle(q.answers.map((a,i)=>({a,i}))).map(x=>`<button class="choice" ${q.en?'dir="ltr" lang="en" style="text-align:left"':''} data-retry-answer="${x.i}">${esc(x.a)}</button>`).join('')}<div class="review-feedback" aria-live="polite"></div>`;box.querySelectorAll('[data-retry-answer]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.retryAnswer)===q.correct;if(ok){delete state.mistakes[key];delete state.errorDetails[key]}else state.mistakes[key]=(state.mistakes[key]||0)+1;save();box.querySelector('.review-feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح؛ أُزيل السؤال من قائمة الأخطاء.':'الإجابة الصحيحة: '+mixed(q.answers[q.correct])}<p>${mixed(q.why)}</p></div>`;box.querySelectorAll('[data-retry-answer]').forEach(x=>x.disabled=true)})}

function renderLanguage(){return `<section class="panel"><div class="eyebrow">تدريب مقترح على لغة السؤال</div><h2>انتبه إلى المطلوب قبل الخيارات</h2><p class="lead">خطوات القراءة: ابحث عن النفي، ثم حدّد المطلوب، ثم استخرج الدليل من المثال. هذه الصياغات للتدريب وليست نموذجًا رسميًا للاختبار.</p>${teachingTable('كلمات تغيّر المطلوب',['الصياغة','كيف أقرأها؟'],[['NOT / EXCEPT','اختر الذي لا يحقق الوصف أو لا ينتمي للقائمة.'],['Most likely / Best','اختر الأنسب وفق الدلائل، لا أي إجابة ممكنة.'],['Identify','حدّد الاسم أو المثال المطابق.'],['Explain','اذكر السبب والدليل.'],['Compare','اذكر الشبه والاختلاف.']])}${languageQuestions.map((q,i)=>`<section class="block" data-language-q="${i}"><h3>المحاولة ${i+1}</h3><p lang="en" dir="ltr">${esc(q.q)}</p>${shuffle(q.a.map((a,j)=>({a,j}))).map(x=>`<button class="choice" lang="en" dir="ltr" style="text-align:left" data-lang-choice="${x.j}">${esc(x.a)}</button>`).join('')}<div class="lang-feedback" aria-live="polite"></div></section>`).join('')}${teachingTable('فروق لغوية ومفهومية شائعة',['زوج الكلمات','الفاصل الذي تبحث عنه'],[['Affect / Affective','Affect مظلة المشاعر؛ Affective صفة تعني وجداني أو متعلق بالشعور.'],['Cognitive / Emotional dissonance','الأول تناقض اتجاهات أو اتجاه وسلوك؛ الثاني اختلاف الشعور الحقيقي والمعروض.'],['Surface-level diversity / Surface acting','الأول اختلاف ظاهر بين الناس؛ الثاني تغيير التعبير الخارجي عن المشاعر.'],['Job involvement / Organizational commitment','الأول ارتباط بالوظيفة؛ الثاني ارتباط بالمؤسسة وأهدافها والرغبة في البقاء.']])}</section>`}

startQuiz=function(){quizOrder=shuffle(examBank).map(q=>({...q,permutation:shuffle(q.answers.map((_,i)=>i))}));quizAnswers={};quizFinished=false;state.activeExam={items:quizOrder,answers:quizAnswers};save();setView('quiz')};
renderQuiz=function(){
 if(!quizOrder.length)return `<section class="panel"><div class="eyebrow">سيناريوهات جديدة · تدريب مقترح</div><h2>اختبار تجريبي بالإنجليزية</h2><p>24 سؤالًا مختلفًا عن تدريبات الدروس، تغطي الفصول الأربعة. لا ترجمة أو تلميحات داخل الأسئلة. لا يوجد نموذج اختبار رسمي في المرفقات.</p><p class="mini">يمكنك مراجعة إجاباتك قبل التسليم. يحفظ هذا المتصفح المحاولة إذا سمح بالتخزين المحلي.</p>${state.lastReport?`<div class="soft">آخر نتيجة محفوظة: ${state.lastReport.score} من ${state.lastReport.total}. <button class="btn ghost" id="lastReportBtn">عرض التقرير</button></div>`:''}<button class="btn" id="startQuiz">ابدأ الاختبار</button></section>`;
 if(quizFinished)return renderReport();
 return `<section class="panel"><div class="eyebrow" dir="ltr" lang="en">Proposed practice exam</div><h2 dir="ltr" lang="en">BUS2108 Practice Test</h2><p dir="ltr" lang="en">Choose ONE best answer. Watch for NOT and EXCEPT. Answer all questions before submitting.</p><p id="examCount" class="mini" dir="ltr">${Object.keys(quizAnswers).length} / ${quizOrder.length} answered</p><div dir="ltr" lang="en">${quizOrder.map((q,n)=>`<fieldset class="quizQ"><legend>${n+1}. ${esc(q.question)}</legend>${q.permutation.map(i=>`<label><input type="radio" name="q${n}" value="${i}" ${quizAnswers[n]===i?'checked':''}> ${esc(q.answers[i])}</label>`).join('')}</fieldset>`).join('')}</div><button class="btn" id="finishQuiz" lang="en" dir="ltr">Submit answers</button><div id="quizNotice" role="alert"></div></section>`;
};
function submitQuiz(){
 if(Object.keys(quizAnswers).length!==quizOrder.length){document.getElementById('quizNotice').textContent=`أجب عن جميع الأسئلة أولًا: ${Object.keys(quizAnswers).length}/${quizOrder.length}.`;return}
 const entries=quizOrder.map((q,n)=>({...q,chosen:quizAnswers[n],ok:quizAnswers[n]===q.correct}));
 for(const q of entries){const key=q.id+':exam';if(q.ok){delete state.mistakes[key];delete state.errorDetails[key]}else{state.mistakes[key]=(state.mistakes[key]||0)+1;state.errorDetails[key]={chosen:q.chosen,time:Date.now()}}}
 state.lastReport={score:entries.filter(q=>q.ok).length,total:entries.length,entries,time:Date.now()};delete state.activeExam;save();quizFinished=true;render();document.getElementById('main').scrollIntoView({block:'start'});
}
renderReport=function(){const r=state.lastReport;if(!r)return '<p>لا يوجد تقرير محفوظ.</p>';const wrong=r.entries.filter(q=>!q.ok);return `<section class="panel"><div class="eyebrow">تقرير بعد التسليم</div><h2>${r.score} من ${r.total} إجابة صحيحة</h2><div class="reportlist">${[1,2,3,4].map(ch=>{const rows=r.entries.filter(q=>q.ch===ch),ok=rows.filter(q=>q.ok).length;return `<div class="stat"><b>${chapterNames[ch]}</b><br><strong>${ok}/${rows.length}</strong><p class="mini">${ok===rows.length?'نقطة قوة في هذه المحاولة':ok>=rows.length*.7?'فهم جيد مع نقاط للمراجعة':'أولوية للمراجعة'}</p></div>`}).join('')}</div><p>راجع الدليل في كل سؤال. الدرجة تقيس هذه المحاولة التدريبية ولا تتنبأ بنتيجة الاختبار الحقيقي.</p><h3>الأسئلة التي تحتاج مراجعة (${wrong.length})</h3>${wrong.map(q=>`<div class="exercise"><b>${esc(lesson(q.id).title)}</b><p dir="ltr" lang="en">${esc(q.question)}</p><p>اختيارك: ${E(q.answers[q.chosen])}<br>الإجابة الصحيحة: ${E(q.answers[q.correct])}</p><p>${mixed(q.why)}</p><p class="mini">المرجع: ${esc(lesson(q.id).src)}</p><button class="btn secondary" data-open="${q.id}">راجع الدرس</button><details class="more"><summary>كلمات مرتبطة بالسؤال، إذا كانت اللغة سبب الخطأ</summary><p class="mini">هذه قائمة للمراجعة المحتملة؛ لا يعني خطأ الإجابة أنك لا تعرف كل هذه الكلمات.</p>${lesson(q.id).terms.slice(0,4).map(t=>`<button class="term" data-report-word="${esc(t)}">${E(t)} · أضف للمراجعة</button>`).join('')}</details></div>`).join('')||'<p>جميع الإجابات صحيحة في هذه المحاولة.</p>'}<details class="more"><summary>راجع أيضًا تعليل الإجابات الصحيحة</summary>${r.entries.filter(q=>q.ok).map(q=>`<div class="block"><p dir="ltr" lang="en">${esc(q.question)}</p><p>${E(q.answers[q.correct])} — ${mixed(q.why)}</p></div>`).join('')}</details><div class="row pager"><button class="btn" id="retryQuiz">ابدأ محاولة جديدة</button><button class="btn secondary" data-view="mistakes">راجع الأخطاء والكلمات</button></div></section>`};

const firstRenderAbout=renderAbout;
renderAbout=function(){return firstRenderAbout().replace('رابط المصدر الدقيق داخل كل درس.','اسم المحاضرة ورقم الصفحة أو الشريحة داخل كل درس.').replace('<div class="row"><button class="btn danger"',`<details class="more"><summary>أسماء الملفات الأصلية والتغطية</summary>${Object.entries(sourceFiles).map(([n,f])=>`<p><b>الفصل ${n}:</b> <bdi dir="ltr">${esc(f)}</bdi></p>`).join('')}<p>قُرئت النصوص والرسوم التعليمية والجداول. الصفحات الختامية في ملفات PDF تحمل شعار الجامعة، وليست صفحات دراسية مفقودة. لم تُنسخ صور الشرائح إلى هذا الملف؛ أُعيد عرض المفاهيم والجداول بصياغة تعليمية.</p><p>أرقام الرسوم الإحصائية القديمة لم تُحوَّل إلى أسئلة حفظ؛ غُطيت دلالاتها مع مرجعها. أسئلة نقاش الشريحة 27 عن الذكاء الاصطناعي ووسائل التواصل مذكورة في درس تحديات المدير.</p><p>ملاحظة المصدر: شريحة التنوع 13 تسرد ستة أبعاد لهوفستد رغم استخدام كلمة خمسة. ذُكر التعارض في الدرس.</p></details><p class="mini">${storageAvailable?'الحفظ المحلي متاح هنا. احتفظ بالملف في مكان ثابت واستخدم المتصفح نفسه؛ نسخ الملف أو نقله قد يفصل التقدم حسب المتصفح.':'هذا المتصفح لا يتيح التخزين المحلي حاليًا. ستعمل التمارين لكن التقدم قد يضيع عند الإغلاق.'}</p><div class="row"><button class="btn danger"`)};

// Add the language section to the existing navigation.
const langButton=document.createElement('button');langButton.dataset.view='language';langButton.textContent='لغة الأسئلة والنفي';document.querySelector('.nav').insertBefore(langButton,document.querySelector('.nav [data-view="quiz"]'));
const oldUpdateChrome=updateChrome;
updateChrome=function(){oldUpdateChrome();document.getElementById('progressText').textContent=`${Object.keys(state.done).length} من ${lessons.length} درسًا علّمتها مكتملة · ${Object.keys(state.learned||{}).length} تدريبًا إنجليزيًا صحيحًا`;};
render=function(){updateChrome();const views={home:renderHome,lesson:renderLesson,vocab:renderVocab,mistakes:renderMistakes,quiz:renderQuiz,about:renderAbout,language:renderLanguage};document.getElementById('main').innerHTML=views[view]();if(!storageAvailable)document.getElementById('main').insertAdjacentHTML('afterbegin','<p class="soft" role="status">الحفظ المحلي غير متاح في هذا المتصفح. تعمل الدروس والتمارين خلال الجلسة الحالية.</p>');bindView()};
bindView=function(){
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLesson(b.dataset.open));
 if(view==='lesson'){
  for(const kind of ['try','en']){const key=current+':'+kind,group=document.getElementById(kind+'Choices');if(!choiceOrders[key])choiceOrders[key]=shuffle([...group.children].map(b=>b.dataset.choice));for(const i of choiceOrders[key])group.appendChild(group.querySelector(`[data-choice="${i}"]`))}
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>answerLesson(b.dataset.kind,b.dataset.choice));document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>showWordInline(b.dataset.term));
  const reveal=document.getElementById('revealStep');if(reveal)reveal.onclick=()=>{teacherStep++;render()};
  document.getElementById('hintBtn').onclick=()=>{const l=lesson(current),box=document.getElementById('hintBox'),advanced=Object.keys(state.learned||{}).length>=6;const translated=()=>{box.innerHTML=`<div class="hint">${E(l.trap)}: ${esc(teaching[l.id].trap)}.</div>`};if(advanced&&!box.dataset.revealed){box.dataset.revealed='yes';box.innerHTML=`<div class="hint">${E(l.trap)} <button class="btn ghost" id="hintTranslate">أظهر المعنى عند الحاجة</button></div>`;document.getElementById('hintTranslate').onclick=translated}else translated();state.hintsUsed++;save()};
  document.getElementById('completeLesson').onclick=()=>{state.done[current]=true;save();updateChrome();document.getElementById('completeLesson').textContent='مكتمل ✓'};
  for(const kind of ['try','check','en']){const key=current+':'+kind;if(Object.hasOwn(responses,key))answerLesson(kind,responses[key],true)}
 }
 if(view==='vocab'){
  const input=document.getElementById('vocabSearch');input.oninput=()=>{vocabFilter=input.value;vocabPage=0;render();const next=document.getElementById('vocabSearch');next.focus({preventScroll:true})};
  document.getElementById('vocabChapter').onchange=e=>{vocabChapter=e.target.value;vocabPage=0;render()};document.getElementById('onlyWrongWords').onchange=e=>{reviewOnly=e.target.checked;vocabPage=0;render()};
  document.getElementById('wordsPrev').onclick=()=>{vocabPage--;render()};document.getElementById('wordsNext').onclick=()=>{vocabPage++;render()};
  document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{const card=document.querySelector(`[data-card="${b.dataset.flip}"]`);card.classList.toggle('flipped');b.setAttribute('aria-expanded',card.classList.contains('flipped'))});
  document.querySelectorAll('[data-word-wrong]').forEach(b=>b.onclick=()=>{state.wordMistakes[vocab[Number(b.dataset.wordWrong)][0]]=true;save();b.textContent='أُضيفت للمراجعة'});
  document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speakWord(vocab[Number(b.dataset.speak)][0],b.closest('.vcard').querySelector('.speech-status')));
  document.getElementById('startMatch').onclick=()=>renderExercise('match');document.getElementById('startFill').onclick=()=>renderExercise('fill');document.getElementById('startRecall').onclick=()=>renderExercise('recall');
 }
 if(view==='mistakes'){document.querySelectorAll('[data-review-word]').forEach(b=>b.onclick=()=>reviewWord(b.dataset.reviewWord));document.querySelectorAll('[data-review-question]').forEach(b=>b.onclick=()=>reviewQuestion(b.dataset.reviewQuestion,b.dataset.slot))}
 if(view==='language')document.querySelectorAll('[data-language-q]').forEach(section=>{const i=Number(section.dataset.languageQ),q=languageQuestions[i];section.querySelectorAll('[data-lang-choice]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.langChoice)===q.c;if(ok){state.languageDone[i]=true;delete state.wordMistakes[q.key]}else state.wordMistakes[q.key]=true;save();section.querySelector('.lang-feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'صحيح.':'الإجابة: '+E(q.a[q.c])}<p>${mixed(q.why)}</p></div>`;section.querySelectorAll('[data-lang-choice]').forEach(x=>x.disabled=true)})});
 if(view==='quiz'){
  const start=document.getElementById('startQuiz');if(start)start.onclick=startQuiz;const retry=document.getElementById('retryQuiz');if(retry)retry.onclick=startQuiz;
  const last=document.getElementById('lastReportBtn');if(last)last.onclick=()=>{quizFinished=true;quizOrder=state.lastReport.entries;render()};
  const finish=document.getElementById('finishQuiz');if(finish){finish.onclick=submitQuiz;document.querySelectorAll('.quizQ input').forEach(r=>r.onchange=()=>{quizAnswers[Number(r.name.slice(1))]=Number(r.value);state.activeExam={items:quizOrder,answers:quizAnswers};save();document.getElementById('examCount').textContent=`${Object.keys(quizAnswers).length} / ${quizOrder.length} answered`})}
  document.querySelectorAll('[data-report-word]').forEach(b=>b.onclick=()=>{state.wordMistakes[b.dataset.reportWord]=true;save();b.textContent='أُضيفت للمراجعة ✓'})
 }
 if(view==='about')document.getElementById('resetProgress').onclick=()=>{if(confirm('هل تريد حذف التقدم والأخطاء ونتيجة الاختبار المحفوظة؟')){try{localStorage.removeItem(KEY)}catch(e){}state={done:{},mistakes:{},wordMistakes:{},hintsUsed:0,mode:'self',learned:{},errorDetails:{},diagnoses:{},languageDone:{}};quizOrder=[];quizAnswers={};quizFinished=false;for(const key of Object.keys(responses))delete responses[key];save();setView('home')}};
};

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('selfMode').onclick=()=>{state.mode='self';save();render()};document.getElementById('teacherMode').onclick=()=>{state.mode='teacher';teacherStep=0;save();render()};document.getElementById('toggleIndex').onclick=()=>{const side=document.getElementById('sidebar');side.classList.toggle('open');document.getElementById('toggleIndex').setAttribute('aria-expanded',side.classList.contains('open'))};render();
</script></body></html>
